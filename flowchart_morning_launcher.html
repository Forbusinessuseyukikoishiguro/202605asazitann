
<h2 class="sr-only">フローチャート：morning_launcher.pyの実行フロー</h2>
<svg width="100%" viewBox="0 0 680 660" role="img">
  <title>フローチャート — morning_launcher.py 実行フロー</title>
  <desc>スクリプト開始からブラウザ起動・タブ展開・終了までの処理の流れ</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ① 開始（角丸楕円） -->
  <g class="node c-gray" onclick="sendPrompt('フローチャートの開始ノードについて教えて')">
    <rect x="255" y="20" width="170" height="40" rx="20" stroke-width="0.5"/>
    <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">開始</text>
  </g>
  <line x1="340" y1="60" x2="340" y2="90" class="arr" marker-end="url(#arrow)"/>

  <!-- ② コマンドライン引数チェック（菱形） -->
  <g class="node c-amber" onclick="sendPrompt('sys.argvでコマンドライン引数を取得する方法を教えて')">
    <polygon points="340,90 460,130 340,170 220,130" stroke-width="0.5"/>
    <text class="th" x="340" y="125" text-anchor="middle" dominant-baseline="central">引数あり？</text>
    <text class="ts" x="340" y="143" text-anchor="middle" dominant-baseline="central">sys.argv</text>
  </g>

  <!-- Yes → BROWSERを上書き -->
  <line x1="460" y1="130" x2="560" y2="130" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>
  <text class="ts" x="510" y="120" text-anchor="middle">Yes</text>
  <g class="node c-teal" onclick="sendPrompt('BROWSERをコマンドライン引数で上書きするとはどういうこと？')">
    <rect x="530" y="108" width="130" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="595" y="126" text-anchor="middle" dominant-baseline="central">BROWSER</text>
    <text class="ts" x="595" y="144" text-anchor="middle" dominant-baseline="central">を上書き</text>
  </g>
  <!-- Yes側 → 下に戻す -->
  <line x1="595" y1="152" x2="595" y2="210" stroke-width="1" stroke="var(--t)" fill="none"/>
  <line x1="595" y1="210" x2="410" y2="210" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)" fill="none"/>

  <!-- No → 直下 -->
  <line x1="340" y1="170" x2="340" y2="196" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>
  <text class="ts" x="320" y="186" text-anchor="middle">No</text>

  <!-- ③ パス検索 -->
  <g class="node c-purple" onclick="sendPrompt('find_browser_path関数の仕組みを詳しく教えて')">
    <rect x="210" y="196" width="200" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="310" y="214" text-anchor="middle" dominant-baseline="central">find_browser_path()</text>
    <text class="ts" x="310" y="232" text-anchor="middle" dominant-baseline="central">インストール先を検索</text>
  </g>
  <line x1="310" y1="240" x2="310" y2="270" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>

  <!-- ④ パスあり？（菱形） -->
  <g class="node c-amber" onclick="sendPrompt('os.path.existsでファイルの存在確認をする方法を教えて')">
    <polygon points="310,270 430,310 310,350 190,310" stroke-width="0.5"/>
    <text class="th" x="310" y="305" text-anchor="middle" dominant-baseline="central">パスあり？</text>
    <text class="ts" x="310" y="323" text-anchor="middle" dominant-baseline="central">os.path.exists</text>
  </g>

  <!-- No → エラー終了 -->
  <line x1="190" y1="310" x2="80" y2="310" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>
  <text class="ts" x="135" y="300" text-anchor="middle">No</text>
  <g class="node c-red" onclick="sendPrompt('sys.exit(1)でエラー終了する方法を教えて')">
    <rect x="20" y="288" width="120" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="80" y="306" text-anchor="middle" dominant-baseline="central">エラー表示</text>
    <text class="ts" x="80" y="324" text-anchor="middle" dominant-baseline="central">sys.exit(1)</text>
  </g>

  <!-- Yes → 下へ -->
  <line x1="310" y1="350" x2="310" y2="390" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>
  <text class="ts" x="330" y="373" text-anchor="start">Yes</text>

  <!-- ⑤ 1枚目を新規ウィンドウで開く -->
  <g class="node c-blue" onclick="sendPrompt('subprocess.Popenで新規ウィンドウを開く方法を教えて')">
    <rect x="170" y="390" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="310" y="408" text-anchor="middle" dominant-baseline="central">1枚目 → 新規ウィンドウ</text>
    <text class="ts" x="310" y="426" text-anchor="middle" dominant-baseline="central">Popen([exe, "--new-window", url])</text>
  </g>
  <line x1="310" y1="434" x2="310" y2="464" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>

  <!-- ⑥ 1.5秒待機 -->
  <g class="node c-gray" onclick="sendPrompt('time.sleepで待機する理由を教えて')">
    <rect x="220" y="464" width="180" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="310" y="484" text-anchor="middle" dominant-baseline="central">1.5秒待機</text>
  </g>
  <line x1="310" y1="504" x2="310" y2="534" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>

  <!-- ⑦ ループ：2枚目以降 -->
  <g class="node c-blue" onclick="sendPrompt('enumerateでURLをループ処理する方法を教えて')">
    <rect x="150" y="534" width="320" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="310" y="554" text-anchor="middle" dominant-baseline="central">for i, url in enumerate(urls[1:])</text>
    <text class="ts" x="310" y="574" text-anchor="middle" dominant-baseline="central">新規タブで開く → interval秒待機</text>
  </g>
  <line x1="310" y1="590" x2="310" y2="620" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>

  <!-- ⑧ 終了 -->
  <g class="node c-gray">
    <rect x="245" y="620" width="130" height="40" rx="20" stroke-width="0.5"/>
    <text class="th" x="310" y="640" text-anchor="middle" dominant-baseline="central">完了・終了</text>
  </g>
</svg>
