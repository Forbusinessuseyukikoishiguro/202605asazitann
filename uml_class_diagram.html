
<h2 class="sr-only">UMLクラス図：BrowserLauncherを中心としたクラス構造図</h2>
<svg width="100%" viewBox="0 0 680 520" role="img">
  <title>UMLクラス図 — BrowserLauncher</title>
  <desc>BrowserLauncher、Browser、Tab、Configの4クラスとその関係を示すUMLクラス図</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="diamond" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <polygon points="7,5 0,1 7,5 0,9 7,5 14,5" fill="none" stroke="context-stroke" stroke-width="1"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== Config クラス (右上) ===== -->
  <g class="node c-teal" onclick="sendPrompt('UMLクラス図のConfigクラスについて詳しく教えて')">
    <rect x="440" y="30" width="210" height="130" rx="8" stroke-width="0.5"/>
    <rect x="440" y="30" width="210" height="28" rx="8" stroke-width="0"/>
    <rect x="440" y="50" width="210" height="8" rx="0" stroke-width="0"/>
    <text class="th" x="545" y="50" text-anchor="middle" dominant-baseline="central">Config</text>
    <line x1="440" y1="62" x2="650" y2="62" stroke-width="0.5"/>
    <text class="ts" x="452" y="82" dominant-baseline="central">+ BROWSER: str = "chrome"</text>
    <text class="ts" x="452" y="100" dominant-baseline="central">+ INTERVAL: float = 0.5</text>
    <text class="ts" x="452" y="118" dominant-baseline="central">+ URLS: list[str]</text>
    <line x1="440" y1="130" x2="650" y2="130" stroke-width="0.5"/>
    <text class="ts" x="452" y="148" dominant-baseline="central">（メソッドなし）</text>
  </g>

  <!-- ===== Browser クラス (左上) ===== -->
  <g class="node c-purple" onclick="sendPrompt('UMLクラス図のBrowserクラスについて詳しく教えて')">
    <rect x="30" y="30" width="210" height="148" rx="8" stroke-width="0.5"/>
    <text class="th" x="135" y="50" text-anchor="middle" dominant-baseline="central">Browser</text>
    <line x1="30" y1="62" x2="240" y2="62" stroke-width="0.5"/>
    <text class="ts" x="42" y="82" dominant-baseline="central">- name: str</text>
    <text class="ts" x="42" y="100" dominant-baseline="central">- exe_path: str</text>
    <line x1="30" y1="114" x2="240" y2="114" stroke-width="0.5"/>
    <text class="ts" x="42" y="132" dominant-baseline="central">+ find_path() → str</text>
    <text class="ts" x="42" y="152" dominant-baseline="central">+ launch(url) → None</text>
  </g>

  <!-- ===== BrowserLauncher クラス (中央) ===== -->
  <g class="node c-blue" onclick="sendPrompt('UMLクラス図のBrowserLauncherクラスについて詳しく教えて')">
    <rect x="190" y="240" width="300" height="166" rx="8" stroke-width="1"/>
    <text class="th" x="340" y="262" text-anchor="middle" dominant-baseline="central">BrowserLauncher</text>
    <line x1="190" y1="276" x2="490" y2="276" stroke-width="0.5"/>
    <text class="ts" x="202" y="296" dominant-baseline="central">- urls: list[str]</text>
    <text class="ts" x="202" y="316" dominant-baseline="central">- browser: Browser</text>
    <text class="ts" x="202" y="336" dominant-baseline="central">- interval: float</text>
    <line x1="190" y1="350" x2="490" y2="350" stroke-width="0.5"/>
    <text class="ts" x="202" y="370" dominant-baseline="central">+ open_tabs() → None</text>
    <text class="ts" x="202" y="390" dominant-baseline="central">+ validate() → bool</text>
  </g>

  <!-- ===== Tab クラス (右下) ===== -->
  <g class="node c-coral" onclick="sendPrompt('UMLクラス図のTabクラスについて詳しく教えて')">
    <rect x="440" y="300" width="210" height="130" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="320" text-anchor="middle" dominant-baseline="central">Tab</text>
    <line x1="440" y1="332" x2="650" y2="332" stroke-width="0.5"/>
    <text class="ts" x="452" y="352" dominant-baseline="central">- url: str</text>
    <text class="ts" x="452" y="370" dominant-baseline="central">- index: int</text>
    <line x1="440" y1="384" x2="650" y2="384" stroke-width="0.5"/>
    <text class="ts" x="452" y="402" dominant-baseline="central">+ open() → None</text>
  </g>

  <!-- BrowserLauncher → Browser（関連） -->
  <line x1="240" y1="240" x2="170" y2="178" class="arr" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="184" y="220" text-anchor="middle">uses</text>

  <!-- BrowserLauncher → Config（依存） -->
  <line x1="430" y1="260" x2="490" y2="160" stroke-dasharray="6 4" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="486" y="216" text-anchor="middle">uses</text>

  <!-- BrowserLauncher → Tab（集約） -->
  <line x1="490" y1="340" x2="440" y2="340" class="arr" stroke-width="1" marker-end="url(#arrow)" fill="none"/>
  <text class="ts" x="467" y="330" text-anchor="middle">1..*</text>

  <!-- 凡例 -->
  <rect x="30" y="450" width="620" height="52" rx="6" stroke-width="0.5" fill="var(--bg2)"/>
  <text class="ts" x="50" y="467" dominant-baseline="central">凡例:</text>
  <line x1="100" y1="467" x2="140" y2="467" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>
  <text class="ts" x="148" y="467" dominant-baseline="central">関連（uses）</text>
  <line x1="260" y1="467" x2="300" y2="467" stroke-dasharray="5 4" stroke-width="1" stroke="var(--t)" marker-end="url(#arrow)"/>
  <text class="ts" x="308" y="467" dominant-baseline="central">依存（dashed）</text>
  <text class="ts" x="50" y="489" dominant-baseline="central">属性の記号:</text>
  <text class="ts" x="138" y="489" dominant-baseline="central">+ = public（公開）</text>
  <text class="ts" x="285" y="489" dominant-baseline="central">- = private（非公開）</text>
  <text class="ts" x="432" y="489" dominant-baseline="central">1..* = 1つ以上</text>
</svg>
